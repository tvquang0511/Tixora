<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" className="w-full h-auto select-none">
  <style>
    .zone-shape {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      stroke: rgba(255, 255, 255, 0.4);
      stroke-width: 1.5;
    }
    .zone-shape:hover {
      filter: brightness(1.25);
      stroke: #ffffff;
      stroke-width: 3;
    }
    .zone-active {
      filter: brightness(1.35) drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
      stroke: #ffffff !important;
      stroke-width: 3.5 !important;
    }
    .zone-text {
      pointer-events: none;
      user-select: none;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>

  <!-- Theatre Hall Border -->
  <rect x="120" y="30" width="760" height="590" rx="24" fill="#111827" stroke="#374151" stroke-width="2" />

  <!-- Theatre Proscenium Stage -->
  <path d="M 240 50 L 760 50 L 730 110 L 270 110 Z" fill="#1f2937" stroke="#fbbf24" stroke-width="2" />
  <text x="500" y="85" fill="#fbbf24" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="4" class="zone-text">SÂN KHẤU NHÀ HÁT VIỆT - XÔ</text>

  <!-- Diamond Row (Rows 1-5 front center) -->
  <rect id="DIAMOND_ROW" data-zone-code="DIAMOND_ROW" class="zone-shape" x="270" y="130" width="460" height="85" rx="8" fill="#f59e0b" fill-opacity="0.85" />
  <text x="500" y="170" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle" class="zone-text">HÀNG GHẾ KIM CƯƠNG (HÀNG 1-5)</text>
  <text x="500" y="195" fill="#fef3c7" font-size="12" font-weight="500" text-anchor="middle" class="zone-text">Tầm nhìn nghệ sĩ cận cảnh tuyệt đối</text>

  <!-- Orchestra Center (Rows 6-15) -->
  <rect id="ORCHESTRA_CENTER" data-zone-code="ORCHESTRA_CENTER" class="zone-shape" x="310" y="235" width="380" height="130" rx="8" fill="#ec4899" fill-opacity="0.85" />
  <text x="500" y="295" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" class="zone-text">TẦNG 1 TRUNG TÂM (HÀNG 6-15)</text>
  <text x="500" y="320" fill="#fce7f3" font-size="12" font-weight="500" text-anchor="middle" class="zone-text">Âm học chuẩn nhà hát opera</text>

  <!-- Orchestra Wings (Left & Right) -->
  <rect id="ORCHESTRA_WING_L" data-zone-code="ORCHESTRA_WING" class="zone-shape" x="160" y="235" width="130" height="130" rx="8" fill="#06b6d4" fill-opacity="0.85" />
  <text x="225" y="305" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" class="zone-text">CÁNH TRÁI</text>

  <rect id="ORCHESTRA_WING_R" data-zone-code="ORCHESTRA_WING" class="zone-shape" x="710" y="235" width="130" height="130" rx="8" fill="#06b6d4" fill-opacity="0.85" />
  <text x="775" y="305" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" class="zone-text">CÁNH PHẢI</text>

  <!-- Mezzanine (Balcony Upper Tier) -->
  <rect id="MEZZANINE" data-zone-code="MEZZANINE" class="zone-shape" x="160" y="400" width="680" height="180" rx="10" fill="#8b5cf6" fill-opacity="0.85" />
  <text x="500" y="480" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle" class="zone-text">TẦNG 2 BAN CÔNG (MEZZANINE)</text>
  <text x="500" y="510" fill="#ede9fe" font-size="13" font-weight="500" text-anchor="middle" class="zone-text">Tầm nhìn bao quát toàn bộ kháng phòng</text>
</svg>
