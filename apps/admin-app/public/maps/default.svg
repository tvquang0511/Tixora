<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" className="w-full h-auto select-none">
  <style>
    .zone-shape {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      stroke: rgba(255, 255, 255, 0.4);
      stroke-width: 1.5;
    }
    .zone-shape:hover {
      filter: brightness(1.25);
      stroke: #ffffff;
      stroke-width: 3;
    }
    .zone-active {
      filter: brightness(1.35) drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
      stroke: #ffffff !important;
      stroke-width: 3.5 !important;
    }
    .zone-text {
      pointer-events: none;
      user-select: none;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>

  <rect x="50" y="20" width="900" height="610" rx="30" fill="#0d1527" stroke="#1e293b" stroke-width="2" />

  <rect x="350" y="45" width="300" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="500" y="82" fill="#38bdf8" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="4" class="zone-text">SÂN KHẤU</text>

  <rect id="SUPER_VIP" data-zone-code="SUPER_VIP" class="zone-shape" x="250" y="130" width="500" height="110" rx="10" fill="#f59e0b" fill-opacity="0.85" />
  <text x="500" y="180" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle" class="zone-text">SUPER VIP</text>
  <text x="500" y="205" fill="#fef3c7" font-size="13" font-weight="500" text-anchor="middle" class="zone-text">Ghế ngồi cao cấp trực diện</text>

  <rect id="VIP" data-zone-code="VIP" class="zone-shape" x="200" y="265" width="600" height="130" rx="10" fill="#ec4899" fill-opacity="0.85" />
  <text x="500" y="325" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" class="zone-text">HẠNG VIP</text>
  <text x="500" y="350" fill="#fce7f3" font-size="13" font-weight="500" text-anchor="middle" class="zone-text">Khu vực trung tâm</text>

  <rect id="STANDARD" data-zone-code="STANDARD" class="zone-shape" x="150" y="420" width="700" height="170" rx="12" fill="#3b82f6" fill-opacity="0.85" />
  <text x="500" y="495" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle" class="zone-text">HẠNG PHỔ THÔNG (STANDARD)</text>
  <text x="500" y="525" fill="#dbeafe" font-size="13" font-weight="500" text-anchor="middle" class="zone-text">Tự do trải nghiệm không khí đại nhạc hội</text>
</svg>
