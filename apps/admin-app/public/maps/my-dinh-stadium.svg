<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" className="w-full h-auto select-none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .zone-shape {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      stroke: rgba(255, 255, 255, 0.4);
      stroke-width: 1.5;
    }
    .zone-shape:hover {
      filter: brightness(1.25);
      stroke: #ffffff;
      stroke-width: 3;
    }
    .zone-active {
      filter: brightness(1.35) drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
      stroke: #ffffff !important;
      stroke-width: 3.5 !important;
    }
    .zone-text {
      pointer-events: none;
      user-select: none;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>

  <!-- Background Pitch Area -->
  <rect x="50" y="20" width="900" height="610" rx="40" fill="#0d1527" stroke="#1e293b" stroke-width="2" />
  
  <!-- Stand CD Outer Flanks -->
  <path id="STAND_CD" data-zone-code="STAND_CD" class="zone-shape"
        d="M 80 180 C 80 80, 200 50, 320 50 L 320 110 C 220 110, 140 140, 140 200 L 140 450 C 140 510, 220 540, 320 540 L 320 600 C 200 600, 80 570, 80 470 Z"
        fill="#8b5cf6" fill-opacity="0.75" />
  <text x="180" y="325" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" class="zone-text" transform="rotate(-90 180 325)">KHÁN ĐÀI C &amp; D</text>

  <path id="STAND_CD_RIGHT" data-zone-code="STAND_CD" class="zone-shape"
        d="M 920 180 C 920 80, 800 50, 680 50 L 680 110 C 780 110, 860 140, 860 200 L 860 450 C 860 510, 780 540, 680 540 L 680 600 C 800 600, 920 570, 920 470 Z"
        fill="#8b5cf6" fill-opacity="0.75" />
  <text x="820" y="325" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" class="zone-text" transform="rotate(90 820 325)">KHÁN ĐÀI C &amp; D</text>

  <!-- Stage -->
  <rect x="350" y="45" width="300" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="500" y="82" fill="#38bdf8" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="4" class="zone-text">SÂN KHẤU CHÍNH</text>

  <!-- VIP A (Left of Stage) -->
  <rect id="VIP_A" data-zone-code="VIP_A" class="zone-shape" x="240" y="130" width="220" height="110" rx="10" fill="#f59e0b" fill-opacity="0.85" />
  <text x="350" y="180" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" class="zone-text">VIP A</text>
  <text x="350" y="205" fill="#fef3c7" font-size="12" font-weight="500" text-anchor="middle" class="zone-text">Sân khấu Trái (Có ghế)</text>

  <!-- VIP B (Right of Stage) -->
  <rect id="VIP_B" data-zone-code="VIP_B" class="zone-shape" x="540" y="130" width="220" height="110" rx="10" fill="#f59e0b" fill-opacity="0.85" />
  <text x="650" y="180" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" class="zone-text">VIP B</text>
  <text x="650" y="205" fill="#fef3c7" font-size="12" font-weight="500" text-anchor="middle" class="zone-text">Sân khấu Phải (Có ghế)</text>

  <!-- FANZONE (Center Standing) -->
  <rect id="FANZONE" data-zone-code="FANZONE" class="zone-shape" x="320" y="260" width="360" height="140" rx="12" fill="#ec4899" fill-opacity="0.85" />
  <text x="500" y="325" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1" class="zone-text">FANZONE STANDING</text>
  <text x="500" y="355" fill="#fce7f3" font-size="13" font-weight="500" text-anchor="middle" class="zone-text">Lòng sân - Đứng tự do</text>

  <!-- Stand A (Lower Tier, Covered) -->
  <rect id="STAND_A" data-zone-code="STAND_A" class="zone-shape" x="260" y="420" width="480" height="90" rx="10" fill="#06b6d4" fill-opacity="0.85" />
  <text x="500" y="465" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" class="zone-text">KHÁN ĐÀI A</text>
  <text x="500" y="490" fill="#cffafe" font-size="12" font-weight="500" text-anchor="middle" class="zone-text">Tầng 1 - Ghế ngồi có mái che</text>

  <!-- Stand B (Upper Tier / Opposite) -->
  <rect id="STAND_B" data-zone-code="STAND_B" class="zone-shape" x="290" y="530" width="420" height="75" rx="10" fill="#3b82f6" fill-opacity="0.85" />
  <text x="500" y="570" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" class="zone-text">KHÁN ĐÀI B</text>
  <text x="500" y="590" fill="#dbeafe" font-size="12" font-weight="500" text-anchor="middle" class="zone-text">Tầng 1 đối diện</text>
</svg>
