name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'apps/backend-api/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'eslint.config.mjs'
  push:
    branches:
      - '**'
    paths:
      - 'apps/backend-api/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'eslint.config.mjs'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tixora
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/tixora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm --filter backend-api run lint

      - name: Generate Prisma client
        run: pnpm --filter backend-api run prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter backend-api run prisma:validate

      - name: Type check backend
        run: pnpm --filter backend-api run typecheck

      - name: Run backend unit tests
        run: pnpm --filter backend-api run test:unit

      - name: Build backend
        run: pnpm --filter backend-api run build

  database:
    name: Database Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tixora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tixora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tixora
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/tixora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend-api run prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter backend-api run prisma:validate

      - name: Apply Prisma migrations
        run: pnpm --filter backend-api run db:migrate:deploy
