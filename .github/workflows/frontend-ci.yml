name: Frontend CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "apps/web-app/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "apps/web-app/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code style verification (Prettier)
        run: pnpm --filter web-app exec prettier --check .

      - name: Static linter audits (ESLint)
        run: pnpm --filter web-app run lint

      - name: Static compiler type-checking (TypeScript)
        run: pnpm --filter web-app run type-check

      - name: Production compilation build test
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: pnpm --filter web-app run build

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Trigger CD Webhook for Staging
        run: |
          if [ -n "${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST -H "Content-Type: application/json" \
                 -d "{\"branch\":\"${{ github.ref_name }}\",\"sha\":\"${{ github.sha }}\"}" \
                 ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
            echo "Successfully triggered staging webhook"
          else
            echo "STAGING_DEPLOY_WEBHOOK_URL is not configured. Skipping deployment."
          fi
