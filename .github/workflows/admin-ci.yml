name: Admin CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "apps/admin-app/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "apps/admin-app/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-ci.yml"
  workflow_dispatch:

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Admin Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code style verification (Prettier)
        run: pnpm --filter admin-app exec prettier --check .

      - name: Static linter audits (ESLint)
        run: pnpm --filter admin-app run lint

      - name: Static compiler type-checking (TypeScript)
        run: pnpm --filter admin-app run type-check

      - name: Production compilation build test
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: pnpm --filter admin-app run build
